<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CDK Store — Admin</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >

  <style>

    .admin-page {
      padding: 70px 0;
    }

    .admin-login,
    .admin-panel {
      max-width: 1000px;
      margin: auto;
    }

    .admin-card {
      padding: 30px;
      border-radius: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .admin-card h1 {
      margin-bottom: 10px;
    }

    .admin-card p {
      color: var(--muted);
      line-height: 1.6;
    }

    .admin-form {
      margin-top: 25px;
      display: flex;
      gap: 10px;
    }

    .admin-form input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: white;
      outline: none;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .stat {
      padding: 22px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 30px;
    }

    .inventory {
      margin-top: 25px;
    }

    .inventory-form {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .inventory-form input {
      width: 150px;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: white;
    }

    .orders {
      display: grid;
      gap: 15px;
      margin-top: 25px;
    }

    .order-card {
      padding: 22px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .order-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .order-id {
      font-family: monospace;
      word-break: break-all;
    }

    .order-status {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(124,92,255,0.1);
      color: var(--accent-2);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .order-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 18px;
    }

    .order-details span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .order-details strong,
    .order-details code {
      font-size: 13px;
      word-break: break-all;
    }

    .order-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .admin-code-list {
      margin-top: 20px;
      max-height: 300px;
      overflow: auto;
      display: grid;
      gap: 8px;
    }

    .admin-code {
      padding: 10px;
      border-radius: 10px;
      background: var(--surface-2);
      font-family: monospace;
      font-size: 12px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {

      .admin-form,
      .inventory-form {
        flex-direction: column;
      }

      .dashboard-grid,
      .order-details {
        grid-template-columns: 1fr;
      }

      .order-head {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>

<header class="navbar">

  <div class="container nav-inner">

    <a
      href="/"
      class="brand"
    >

      <span class="brand-mark">
        C
      </span>

      <span>
        CDK<span class="brand-accent">STORE</span>
      </span>

    </a>

    <nav>

      <a href="/">
        Store
      </a>

      <a href="/#how-it-works">
        How It Works
      </a>

    </nav>

  </div>

</header>


<main class="admin-page">

  <div class="container">


    <!-- LOGIN -->

    <section
      id="loginSection"
      class="admin-login"
    >

      <div class="admin-card">

        <span class="eyebrow">
          ADMIN ACCESS
        </span>

        <h1>
          Store Dashboard
        </h1>

        <p>
          Sign in to manage orders and
          CDK inventory.
        </p>

        <form
          id="loginForm"
          class="admin-form"
        >

          <input
            id="adminPassword"
            type="password"
            placeholder="Admin password"
            required
          >

          <button
            class="btn btn-primary"
            type="submit"
          >
            Sign In
          </button>

        </form>

        <div
          id="loginMessage"
          style="margin-top:15px"
        ></div>

      </div>

    </section>


    <!-- DASHBOARD -->

    <section
      id="dashboard"
      class="admin-panel hidden"
    >

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:15px;
          flex-wrap:wrap;
        "
      >

        <div>

          <span class="eyebrow">
            ADMIN
          </span>

          <h1>
            Dashboard
          </h1>

        </div>

        <button
          id="logoutButton"
          class="btn btn-secondary"
        >
          Logout
        </button>

      </div>


      <!-- STATS -->

      <div class="dashboard-grid">

        <div class="stat">

          <span>
            Total CDKs
          </span>

          <strong id="totalCodes">
            0
          </strong>

        </div>

        <div class="stat">

          <span>
            Available CDKs
          </span>

          <strong id="availableCodes">
            0
          </strong>

        </div>

        <div class="stat">

          <span>
            Used CDKs
          </span>

          <strong id="usedCodes">
            0
          </strong>

        </div>

      </div>


      <!-- INVENTORY -->

      <div class="admin-card inventory">

        <h2>
          Generate CDKs
        </h2>

        <p>
          Add new CDKs to the available
          inventory.
        </p>

        <form
          id="generateForm"
          class="inventory-form"
        >

          <input
            id="generateQuantity"
            type="number"
            min="1"
            max="10000"
            value="10"
            required
          >

          <button
            class="btn btn-primary"
            type="submit"
          >
            Generate
          </button>

        </form>

        <div
          id="generatedCodes"
          class="admin-code-list"
        ></div>

      </div>


      <!-- ORDERS -->

      <div style="margin-top:45px">

        <span class="eyebrow">
          ORDERS
        </span>

        <h2>
          Customer Orders
        </h2>

      </div>

      <div
        id="orders"
        class="orders"
      ></div>

    </section>

  </div>

</main>


<script>

let adminToken =
  sessionStorage.getItem(
    "cdk_admin_token"
  );


const loginSection =
  document.getElementById(
    "loginSection"
  );

const dashboard =
  document.getElementById(
    "dashboard"
  );


/* =====================================================
   API
===================================================== */

async function api(
  url,
  options = {}
) {

  options.headers =
    options.headers || {};

  if (
    adminToken
  ) {

    options.headers[
      "x-admin-token"
    ] =
      adminToken;

  }

  if (
    options.body &&
    typeof options.body !==
      "string"
  ) {

    options.headers[
      "Content-Type"
    ] =
      "application/json";

    options.body =
      JSON.stringify(
        options.body
      );

  }

  const response =
    await fetch(
      url,
      options
    );

  const data =
    await response.json();

  if (
    response.status === 401
  ) {

    logout();

  }

  return {
    response,
    data
  };

}


/* =====================================================
   LOGIN
===================================================== */

document
  .getElementById(
    "loginForm"
  )
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      const password =
        document.getElementById(
          "adminPassword"
        ).value;

      const button =
        event.target.querySelector(
          "button"
        );

      button.disabled =
        true;

      button.textContent =
        "Signing in...";

      try {

        const {
          response,
          data
        } =
          await api(
            "/api/admin/login",
            {
              method:
                "POST",

              body: {
                password
              }
            }
          );

        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Login failed."
          );

        }

        adminToken =
          data.token;

        sessionStorage.setItem(
          "cdk_admin_token",
          adminToken
        );

        showDashboard();

      } catch (error) {

        document.getElementById(
          "loginMessage"
        ).textContent =
          error.message;

      } finally {

        button.disabled =
          false;

        button.textContent =
          "Sign In";

      }

    }
  );


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard() {

  loginSection.classList.add(
    "hidden"
  );

  dashboard.classList.remove(
    "hidden"
  );

  loadDashboard();

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

  adminToken =
    null;

  sessionStorage.removeItem(
    "cdk_admin_token"
  );

  dashboard.classList.add(
    "hidden"
  );

  loginSection.classList.remove(
    "hidden"
  );

}


/* =====================================================
   LOGOUT BUTTON
===================================================== */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    logout
  );


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard() {

  await loadInventory();

  await loadOrders();

}


/* =====================================================
   INVENTORY
===================================================== */

async function loadInventory() {

  const {
    response,
    data
  } =
    await api(
      "/api/admin/codes"
    );

  if (
    !response.ok ||
    !data.success
  ) {

    return;

  }

  document.getElementById(
    "totalCodes"
  ).textContent =
    data.total;

  document.getElementById(
    "availableCodes"
  ).textContent =
    data.available;

  document.getElementById(
    "usedCodes"
  ).textContent =
    data.used;

}


/* =====================================================
   GENERATE CDKs
===================================================== */

document
  .getElementById(
    "generateForm"
  )
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      const quantity =
        Number(
          document.getElementById(
            "generateQuantity"
          ).value
        );

      const {
        response,
        data
      } =
        await api(
          "/api/admin/codes",
          {
            method:
              "POST",

            body: {
              quantity
            }
          }
        );

      if (
        !response.ok ||
        !data.success
      ) {

        alert(
          data.message ||
          "Generation failed."
        );

        return;

      }

      const output =
        document.getElementById(
          "generatedCodes"
        );

      output.innerHTML =
        "";

      data.codes.forEach(
        code => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "admin-code";

          item.textContent =
            code;

          output.appendChild(
            item
          );

        }
      );

      await loadInventory();

    }
  );


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders() {

  const {
    response,
    data
  } =
    await api(
      "/api/admin/orders"
    );

  if (
    !response.ok ||
    !data.success
  ) {

    return;

  }

  const container =
    document.getElementById(
      "orders"
    );

  container.innerHTML =
    "";

  if (
    !data.orders.length
  ) {

    container.innerHTML =
      `
      <div class="admin-card">
        No orders yet.
      </div>
      `;

    return;

  }

  data.orders.forEach(
    order => {

      container.appendChild(
        createOrderCard(
          order
        )
      );

    }
  );

}


/* =====================================================
   ORDER CARD
===================================================== */

function createOrderCard(
  order
) {

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "order-card";

  const tx =
    order.txHash ||
    "Not submitted";

  const date =
    order.createdAt
      ? new Date(
          order.createdAt
        ).toLocaleString()
      : "—";

  card.innerHTML =
    `
      <div class="order-head">

        <div>

          <div class="small-label">
            ORDER
          </div>

          <div class="order-id">
            ${escapeHTML(order.id)}
          </div>

        </div>

        <span class="order-status">
          ${escapeHTML(order.status)}
        </span>

      </div>


      <div class="order-details">

        <div>

          <span>
            Quantity
          </span>

          <strong>
            ${order.quantity}
          </strong>

        </div>


        <div>

          <span>
            Amount
          </span>

          <strong>
            ${order.amountUsd} USDT
          </strong>

        </div>


        <div>

          <span>
            Created
          </span>

          <strong>
            ${escapeHTML(date)}
          </strong>

        </div>


        <div>

          <span>
            Transaction
          </span>

          <code>
            ${escapeHTML(tx)}
          </code>

        </div>


        <div>

          <span>
            Assigned CDKs
          </span>

          <strong>
            ${(order.codes || []).length}
          </strong>

        </div>

      </div>


      <div class="order-actions">

        ${
          order.status ===
          "PENDING_REVIEW"

            ? `
              <button
                class="btn btn-primary approve-button"
              >
                Approve & Release CDKs
              </button>

              <button
                class="btn btn-secondary reject-button"
              >
                Reject
              </button>
            `

            : ""
        }


        ${
          order.status !==
            "CONFIRMED"

            ? `
              <button
                class="btn btn-secondary reset-button"
              >
                Reset
              </button>

              <button
                class="btn btn-secondary delete-button"
              >
                Delete
              </button>
            `

            : ""
        }

      </div>
    `;


  const approve =
    card.querySelector(
      ".approve-button"
    );

  if (
    approve
  ) {

    approve.addEventListener(
      "click",
      async () => {

        if (
          !confirm(
            "Approve this order and release CDKs?"
          )
        ) {

          return;

        }

        const {
          response,
          data
        } =
          await api(
            `/api/admin/orders/${order.id}/approve`,
            {
              method:
                "POST"
            }
          );

        if (
          !response.ok ||
          !data.success
        ) {

          alert(
            data.message ||
            "Approval failed."
          );

          return;

        }

        await loadDashboard();

      }
    );

  }


  const reject =
    card.querySelector(
      ".reject-button"
    );

  if (
    reject
  ) {

    reject.addEventListener(
      "click",
      async () => {

        if (
          !confirm(
            "Reject this order?"
          )
        ) {

          return;

        }

        const {
          response,
          data
        } =
          await api(
            `/api/admin/orders/${order.id}/reject`,
            {
              method:
                "POST"
            }
          );

        if (
          !response.ok ||
          !data.success
        ) {

          alert(
            data.message ||
            "Rejection failed."
          );

          return;

        }

        await loadDashboard();

      }
    );

  }


  const reset =
    card.querySelector(
      ".reset-button"
    );

  if (
    reset
  ) {

    reset.addEventListener(
      "click",
      async () => {

        const {
          response,
          data
        } =
          await api(
            `/api/admin/orders/${order.id}/reset`,
            {
              method:
                "POST"
            }
          );

        if (
          !response.ok ||
          !data.success
        ) {

          alert(
            data.message ||
            "Reset failed."
          );

          return;

        }

        await loadDashboard();

      }
    );

  }


  const deleteButton =
    card.querySelector(
      ".delete-button"
    );

  if (
    deleteButton
  ) {

    deleteButton.addEventListener(
      "click",
      async () => {

        if (
          !confirm(
            "Delete this order?"
          )
        ) {

          return;

        }

        const {
          response,
          data
        } =
          await api(
            `/api/admin/orders/${order.id}`,
            {
              method:
                "DELETE"
            }
          );

        if (
          !response.ok ||
          !data.success
        ) {

          alert(
            data.message ||
            "Delete failed."
          );

          return;

        }

        await loadDashboard();

      }
    );

  }


  return card;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   AUTO LOGIN
===================================================== */

if (
  adminToken
) {

  showDashboard();

}

</script>

</body>

</html>
